name: Release Yeguo
run-name: Release Yeguo · ${{ github.event_name }} · ${{ github.sha }}

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      sync_backend_only:
        description: 仅重试当前已发布版本的后台同步
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: yeguo-release
  cancel-in-progress: false

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  BACKEND_BASE_URL: http://thankful.top:4396
  BACKEND_CLIENT: Yeguo

jobs:
  version:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.version.outputs.mode }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: python3 scripts/release_workflow.py detect
        env:
          SYNC_BACKEND_ONLY: ${{ inputs.sync_backend_only == true }}
          GH_TOKEN: ${{ github.token }}

  android:
    needs: version
    if: needs.version.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true
      - name: Select consistent Android NDK
        run: |
          sdkmanager 'ndk;28.2.13676358'
          echo "ANDROID_NDK_VERSION=28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Configure required release signing
        run: |
          python3 scripts/configure_signing.py
          test -f android/key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python3 scripts/build_android.py --abi arm64-v8a
      - name: Verify release certificates
        shell: bash
        run: |
          set -euo pipefail
          for apk in dist/android/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-certificate.txt"
            python3 scripts/release_workflow.py verify-certificate "$RUNNER_TEMP/apk-certificate.txt"
          done
      - name: Remove signing files
        if: always()
        run: python3 scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: yeguo-android
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [version, android]
    if: needs.version.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare packages and update manifest
        run: python3 scripts/release_workflow.py prepare
      - name: Publish complete Release
        run: python3 scripts/release_workflow.py publish
        env:
          GH_TOKEN: ${{ github.token }}

  sync-backend:
    needs: [version, release]
    if: >-
      always() &&
      (needs.version.outputs.mode == 'sync' ||
       (needs.version.outputs.mode == 'publish' && needs.release.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Register and verify Yeguo backend version
        run: python3 scripts/release_workflow.py sync
        env:
          GH_TOKEN: ${{ github.token }}
